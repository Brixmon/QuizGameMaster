<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>QuizGameMaster Master Layout V4.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02070d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#app{height:100vh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 22%,#245f8d,#0b2235 50%,#020911 100%)}.stage{position:absolute;top:2.5%;bottom:29%;left:5%;right:5%}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.98);transition:.35s}.on{opacity:1;transform:none}.timer{width:78%;height:1.5vh;border:2px solid white;border-radius:20px;padding:2px;margin-bottom:1.5vh}.bar{height:100%;width:100%;border-radius:12px;background:#43df54}.q{font-size:3vh;font-weight:900;line-height:1.04;text-align:center;margin-bottom:1.4vh}.visual{height:27vh;width:78%;border-radius:2vh;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#174b72,#07131e);box-shadow:0 1.4vh 4vh #0008}.visual img{width:100%;height:100%;object-fit:cover}.word{font-size:4.4vh;font-weight:900;color:#f4d06b}.symbol{font-size:9vh}.answers{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:1vh;margin-top:1.6vh}.ans{height:7vh;border:1px solid #ffffff25;border-radius:1.5vh;background:#ffffff0b;display:flex;align-items:center;gap:.8vh;padding:.7vh;font-size:1.7vh;font-weight:900}.letter{width:4.4vh;height:4.4vh;display:grid;place-items:center;border-radius:1vh;background:#ffffff10;color:#f2ce69;font-size:2vh}.ans img{width:5vh;height:3.3vh;object-fit:cover;border-radius:.4vh}.ans.good{background:#0b673d;border-color:#58ef91;box-shadow:0 0 25px #43ec8544;transform:scale(1.025);transition:.35s}.ans.bad{opacity:.28;transition:.35s}.ey{font-size:1.3vh;letter-spacing:.15em;color:#a9c0d0;font-weight:900}.picked{font-size:3.2vh;color:#ffd45e;font-weight:900}.correct{border:1px solid #52ee8d;background:#075f3bd9;color:#60f299;border-radius:25px;padding:.8vh 2vh;font-weight:900}.country{font-size:4.5vh;font-weight:900;margin:1.5vh}.factpic{height:25vh;width:78%;border-radius:2vh;display:grid;place-items:center;font-size:9vh;background:radial-gradient(circle,#28b8d855,transparent 35%),linear-gradient(#12658a,#06141e);box-shadow:0 1vh 3vh #0008}.fact{width:82%;margin-top:1.4vh;padding:1.2vh 1.5vh;border:1px solid #f1cf6566;border-radius:1.5vh;background:#071824e8;font-size:1.9vh;text-align:center}.fact b{display:block;color:#f3d16d;font-size:1.2vh;letter-spacing:.1em;margin-bottom:.4vh}.safe{position:absolute;bottom:0;left:0;right:0;height:29%;border-top:1px dashed #ffffff0c}.safe div{text-align:center;color:#ffffff0a;font-size:1vh;margin-top:1vh}.reelV4{position:relative;height:27vh;width:88%;margin:1.6vh 0 1vh;overflow:hidden;mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);perspective:45vh}.reelV4 #items{font-size:2.5vh;line-height:5.4vh;text-align:center;font-weight:900;color:#7694aa;will-change:transform}.reelV4 #items div{height:5.4vh;transition:.2s}.focusLine{position:absolute;left:8%;right:8%;top:10.8vh;height:5.4vh;border-top:1px solid #ffd45e44;border-bottom:1px solid #ffd45e44;background:linear-gradient(90deg,transparent,#ffd45e0c,transparent);pointer-events:none}.difficultyFlow{width:100%;opacity:0;transform:translateY(1.5vh);transition:.35s}.difficultyFlow.show{opacity:1;transform:none}.rankRail{display:flex;justify-content:center;gap:.65vh;width:100%;margin:1.2vh auto}.rank{width:7.4vh;padding:.85vh .1vh;border-radius:1.1vh;border:1px solid #ffffff1d;background:#ffffff08;text-align:center;font-size:.95vh;font-weight:900;color:#7993a6;transition:.16s}.rank .ico{display:block;font-size:2.25vh;margin-bottom:.25vh}.rank.hot{transform:translateY(-.45vh) scale(1.08);color:#fff;border-color:#ffd45e;background:#ffd45e18;box-shadow:0 0 1.8vh #ffd45e44}.rank.final{color:#fff;border-color:#ffd45e;background:#ffd45e2b;box-shadow:0 0 1.2vh #ffd45e,0 0 3vh #ffd45e88;transform:translateY(-.65vh) scale(1.18);animation:rankLock .65s cubic-bezier(.2,1.5,.35,1) both}.difficultyLabel{text-align:center;font-size:1.05vh;font-weight:900;letter-spacing:.16em;color:#9eb7c8;margin-top:.8vh}@keyframes rankLock{0%{transform:scale(.82);filter:brightness(2.2)}55%{transform:translateY(-.75vh) scale(1.28)}100%{transform:translateY(-.65vh) scale(1.18)}}.readyDots{text-align:center;font-size:2.1vh;font-weight:1000;letter-spacing:.08em;margin-top:1.1vh;opacity:0;transform:translateY(.8vh);transition:.3s;color:#eef7fb}.readyDots.show{opacity:1;transform:none}.dots i{font-style:normal;opacity:.15;animation:dot 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes dot{0%,20%{opacity:.15}45%,75%{opacity:1}100%{opacity:.15}}.commentPrompt{margin:.85vh 0 .15vh;font-size:1.15vh;letter-spacing:.055em;color:#b9cfdd;text-align:center;font-weight:700}.commentPrompt b{color:#f3d16d;font-weight:1000}.selectedCategory{color:#ffd45e!important;font-size:3vh!important;letter-spacing:.08em;text-shadow:0 0 .8vh #ffd45e,0 0 2.4vh #ffd45e88;animation:selectedPop .65s cubic-bezier(.2,1.5,.35,1) both}@keyframes selectedPop{0%{transform:scale(.75);filter:blur(2px)}55%{transform:scale(1.22);filter:blur(0)}100%{transform:scale(1.08)}}
</style>
<div id="app"><div class="stage"><div id="cat" class="screen on"><div class="ey">NEXT CATEGORY</div><div class="reelV4"><div id="items"></div><div class="focusLine"></div></div><div id="picked" class="picked"></div><div id="difficultyFlow" class="difficultyFlow"><div class="difficultyLabel">DIFFICULTY LEVEL</div><div id="rankRail" class="rankRail"></div><div id="readyDots" class="readyDots">GET READY<span class="dots"><i>.</i><i>.</i><i>.</i></span></div></div></div><div id="question" class="screen"><div class="timer"><div id="bar" class="bar"></div></div><div id="qt" class="q"></div><div id="visual" class="visual"></div><div class="commentPrompt">💬 TYPE <b>A, B, C or D</b> IN THE COMMENTS</div><div id="answers" class="answers"></div></div><div id="reveal" class="screen"><div class="correct">✓ CORRECT ANSWER</div><div id="country" class="country"></div><div id="factpic" class="factpic"></div><div class="fact"><b>QUICK FACT</b><span id="fact"></span></div></div></div><div class="safe"><div>TikTok chat / interface safe zone</div></div></div>
<script>
const D=[{c:"FLAGS",d:"EASY",q:"WHICH COUNTRY DOES THIS FLAG BELONG TO?",k:"flag",h:"jp",a:[["China",""],["Vietnam",""],["Japan",""],["South Korea",""]],ok:"JAPAN",f:"Japan is made up of more than 14,000 islands.",fi:"🏝️"},{c:"FLAGS",d:"MEDIUM",q:"WHICH FLAG BELONGS TO BRAZIL?",k:"reverse",h:"BRAZIL",a:[["","ar"],["","co"],["","mx"],["","br"]],ok:"BRAZIL",f:"Brazil borders 10 South American countries.",fi:"🌎"},{c:"CAPITALS",d:"MEDIUM",q:"WHICH COUNTRY HAS CANBERRA AS ITS CAPITAL?",k:"text",h:"CANBERRA",a:[["New Zealand",""],["Canada",""],["Australia",""],["South Africa",""]],ok:"AUSTRALIA",f:"Canberra was chosen between rivals Sydney and Melbourne.",fi:"🏙️"},{c:"LANDMARKS",d:"HARD",q:"IN WHICH COUNTRY WOULD YOU FIND PETRA?",k:"symbol",h:"🏜️",a:[["Egypt",""],["Turkey",""],["Morocco",""],["Jordan",""]],ok:"JORDAN",f:"Petra was carved into rose-colored sandstone cliffs.",fi:"🏜️"}];
let i=0,p="cat",st,raf,last=-1,audio;const $=x=>document.getElementById(x),flag=x=>"https://flagcdn.com/w320/"+x+".png";const ranks=[["🌱","NEWBIE"],["🎯","ROOKIE"],["⚡","PRO"],["🥷","NINJA"],["👑","MASTER"]];
function tone(f,d,v=.01){try{audio||=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function show(x){["cat","question","reveal"].forEach(y=>$(y).classList.toggle("on",x==y))}
function category(){p="cat";show("cat");let q=D[i];$("picked").textContent="";$("difficultyFlow").classList.remove("show");$("readyDots").classList.remove("show");const baseCats=["FLAGS","LANDMARKS","CAPITALS","CULTURE","MAPS"];let seq=[];for(let r=0;r<7;r++)seq.push(...baseCats);let targetIndex=seq.length;seq.push(q.c,...baseCats,...baseCats);$("items").innerHTML=seq.map(x=>"<div>"+x+"</div>").join("");$("items").style.transition="none";$("items").style.transform="translateY(0)";let itemH=5.4,focusIndex=2,y=-(targetIndex-focusIndex)*itemH;requestAnimationFrame(()=>requestAnimationFrame(()=>{$("items").style.transition="transform 3.7s cubic-bezier(.08,.70,.06,1)";$("items").style.transform="translateY("+y+"vh)"}));for(let n=0;n<21;n++)setTimeout(()=>tone(270+n*19,.025,.0035+n*.00045),220+n*145);setTimeout(()=>{tone(920,.14,.03);let els=$("items").children;if(els[targetIndex])els[targetIndex].classList.add("selectedCategory")},3800);setTimeout(()=>rankContinue(q),4400)}
function rankContinue(q){let ix=q.d=="EASY"?0:q.d=="HARD"?3:2;$("rankRail").innerHTML=ranks.map((r,n)=>"<div class='rank' id='rk"+n+"'><span class='ico'>"+r[0]+"</span>"+r[1]+"</div>").join("");$("difficultyFlow").classList.add("show");let seq=[0,1,2,3,4,3,2,1,2,3,4,3,2,ix],n=0;let iv=setInterval(()=>{document.querySelectorAll(".rank").forEach(e=>e.classList.remove("hot"));$("rk"+seq[n]).classList.add("hot");tone(420+n*15,.025,.0055);n++;if(n>=seq.length){clearInterval(iv);document.querySelectorAll(".rank").forEach((e,j)=>{e.classList.remove("hot");if(j!=ix)e.style.opacity=".28"});$("rk"+ix).classList.add("final");tone(980,.14,.03);setTimeout(()=>tone(1250,.16,.025),90);setTimeout(()=>$("readyDots").classList.add("show"),550);setTimeout(question,2700)}},135)}
function question(){p="q";show("question");let q=D[i];$("qt").textContent=q.q;let v=$("visual");if(q.k=="flag")v.innerHTML="<img src='"+flag(q.h)+"'>";else if(q.k=="symbol")v.innerHTML="<div class='symbol'>"+q.h+"</div>";else v.innerHTML="<div class='word'>"+q.h+"</div>";$("answers").innerHTML=q.a.map((a,n)=>"<div class='ans'><div class='letter'>"+"ABCD"[n]+"</div>"+(q.k=="reverse"?"<img src='"+flag(a[1])+"'>":"")+"<span>"+a[0]+"</span></div>").join("");st=performance.now();last=-1;raf=requestAnimationFrame(tick)}
function tick(now){let t=Math.min(1,(now-st)/30000),r=Math.pow(1-t,1.85);$("bar").style.width=r*100+"%";$("bar").style.background="hsl("+(120*(1-t))+" 86% 48%)";let s=Math.floor((now-st)/1000);if(s!=last){last=s;tone(500+300*t,.03,.003+.022*t*t)}if(t<1&&p=="q")raf=requestAnimationFrame(tick);else if(p=="q")reveal()}
function reveal(){if(p!="q")return;p="mark";cancelAnimationFrame(raf);let q=D[i],cards=[...$("answers").children],idx=q.a.findIndex(a=>a[0].toUpperCase()==q.ok||(q.k=="reverse"&&a[1]=="br"));cards.forEach((e,n)=>e.classList.add(n==idx?"good":"bad"));tone(660,.07,.025);setTimeout(()=>tone(920,.12,.03),100);setTimeout(()=>{p="r";show("reveal");$("country").textContent=q.ok;$("factpic").textContent=q.fi;$("fact").textContent=q.f},1500);setTimeout(()=>{i=(i+1)%D.length;category()},6500)}
document.body.onclick=()=>{audio||=new(window.AudioContext||window.webkitAudioContext)();if(p=="q")reveal()};category();
</script>
