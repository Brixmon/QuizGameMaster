<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>QuizGameMaster Engine</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02070d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#app{height:100vh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 22%,#245f8d,#0b2235 50%,#020911 100%)}.stage{position:absolute;top:2.5%;bottom:29%;left:5%;right:5%}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.98);transition:.35s;pointer-events:none}.on{opacity:1;transform:none}.ey{font-size:1.3vh;letter-spacing:.15em;color:#a9c0d0;font-weight:900}.reel{height:27vh;width:88%;margin:1.6vh 0 1vh;overflow:hidden;position:relative;mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}#items{font-size:2.5vh;line-height:5.4vh;text-align:center;font-weight:900;color:#7694aa;will-change:transform}#items div{height:5.4vh}.focus{position:absolute;left:8%;right:8%;top:10.8vh;height:5.4vh;border-top:1px solid #ffd45e44;border-bottom:1px solid #ffd45e44;background:#ffd45e08}.selected{color:#ffd45e!important;font-size:3vh!important;text-shadow:0 0 .8vh #ffd45e,0 0 2.4vh #ffd45e88;animation:pop .65s cubic-bezier(.2,1.5,.35,1)}@keyframes pop{55%{transform:scale(1.22)}100%{transform:scale(1.08)}}.difficulty{width:100%;opacity:0;transform:translateY(1vh);transition:.35s}.difficulty.show{opacity:1;transform:none}.dl{text-align:center;font-size:1.05vh;font-weight:900;letter-spacing:.16em;color:#9eb7c8}.rail{display:flex;justify-content:center;gap:.65vh;margin:1.2vh auto}.rank{width:7.4vh;padding:.85vh .1vh;border-radius:1.1vh;border:1px solid #ffffff1d;background:#ffffff08;text-align:center;font-size:.95vh;font-weight:900;color:#7993a6;transition:.16s}.rank span{display:block;font-size:2.25vh}.rank.hot{transform:translateY(-.45vh) scale(1.08);color:#fff;border-color:#ffd45e;background:#ffd45e18}.rank.final{color:#fff;border-color:#ffd45e;background:#ffd45e2b;box-shadow:0 0 1.2vh #ffd45e,0 0 3vh #ffd45e88;transform:scale(1.18)}.ready{text-align:center;font-size:2.1vh;font-weight:1000;margin-top:1.1vh;opacity:0;transition:.3s}.ready.show{opacity:1}.timer{width:78%;height:1.5vh;border:2px solid white;border-radius:20px;padding:2px;margin-bottom:1.5vh}.bar{height:100%;width:100%;border-radius:12px;background:#43df54}.q{font-size:3vh;font-weight:900;line-height:1.04;text-align:center;margin-bottom:1.4vh}.visual{height:27vh;width:78%;border-radius:2vh;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#174b72,#07131e);box-shadow:0 1.4vh 4vh #0008}.visual.landscape{width:111%;height:auto;aspect-ratio:16/9;border-radius:0;box-shadow:none;background:transparent}.visual.landscape .mediafade{background:transparent}.visual.landscape .mediafade .blur{display:none}.visual.landscape .mediafade .main{object-fit:contain;-webkit-mask-image:none;mask-image:none}.visual img{width:100%;height:100%;object-fit:cover}.mediafade{position:relative;width:100%;height:100%;overflow:hidden;background:#07131e}.mediafade .blur{position:absolute;inset:-7%;width:114%;height:114%;object-fit:cover;filter:blur(18px) brightness(.55) saturate(.85);transform:scale(1.04)}.mediafade .main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:none;z-index:1;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 9%,#000 91%,transparent 100%)}.subject{font-size:4.4vh;font-weight:900;color:#f4d06b}.prompt{margin:.85vh 0 .15vh;font-size:1.15vh;color:#b9cfdd;font-weight:700}.prompt b{color:#f3d16d}.answers{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:1vh;margin-top:1.2vh}.ans{height:7vh;border:1px solid #ffffff25;border-radius:1.5vh;background:#ffffff0b;display:flex;align-items:center;gap:.8vh;padding:.7vh;font-size:1.7vh;font-weight:900}.letter{width:4.4vh;height:4.4vh;display:grid;place-items:center;border-radius:1vh;background:#ffffff10;color:#f2ce69;font-size:2vh}.ans img{width:5vh;height:3.3vh;object-fit:cover;border-radius:.4vh}.good{background:#0b673d!important;border-color:#58ef91!important;box-shadow:0 0 25px #43ec8544;transform:scale(1.025)}.bad{opacity:.28}.correct{border:1px solid #52ee8d;background:#075f3bd9;color:#60f299;border-radius:25px;padding:.8vh 2vh;font-weight:900}.country{font-size:4.5vh;font-weight:900;margin:1.5vh}.factpic{width:111%;height:27vh;aspect-ratio:auto;border-radius:0;overflow:hidden;display:grid;place-items:center;font-size:7vh;background:transparent}.factpic .mediafade{border-radius:0;background:transparent}.factpic .mediafade .blur{display:none}.factpic .mediafade .main{object-fit:contain;-webkit-mask-image:none;mask-image:none}.fact{width:82%;margin-top:1.4vh;padding:1.2vh 1.5vh;border:1px solid #f1cf6566;border-radius:1.5vh;background:#071824e8;font-size:1.9vh;text-align:center}.fact b{display:block;color:#f3d16d;font-size:1.2vh;letter-spacing:.1em;margin-bottom:.4vh}.safe{position:absolute;bottom:0;left:0;right:0;height:29%;border-top:1px dashed #ffffff0c}.safe div{text-align:center;color:#ffffff0a;font-size:1vh;margin-top:1vh}.version{position:absolute;z-index:50;top:1.4vh;right:2.4vh;font-size:.82vh;font-weight:700;letter-spacing:.05em;color:#ffffff66;pointer-events:none}
.modegate{position:absolute;inset:0;z-index:100;background:radial-gradient(circle at 50% 25%,#245f8d,#0b2235 48%,#020911);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vh 7%;text-align:center}.modegate.hide{display:none}.modegate h1{margin:0 0 .8vh;font-size:4vh;letter-spacing:.03em}.modegate .sub{font-size:1.25vh;color:#9eb7c8;letter-spacing:.14em;font-weight:900;margin-bottom:5vh}.modebtn{width:88%;padding:2.1vh 1vh;margin:.8vh;border-radius:1.8vh;border:1px solid #ffffff25;background:#ffffff0c;color:white;font-size:2.15vh;font-weight:900;box-shadow:0 1vh 3vh #0005}.modebtn.live{border-color:#ff5c6888;box-shadow:0 0 2.5vh #ff405533}.modebtn.dev{border-color:#62bfff88;box-shadow:0 0 2.5vh #299cff33}.devpanel{position:absolute;inset:0;z-index:90;background:radial-gradient(circle at 50% 25%,#245f8d,#0b2235 48%,#020911);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}.devpanel.show{display:flex}.devpanel h2{font-size:2.8vh;margin:0 0 .7vh}.devpanel .hint{font-size:1.2vh;color:#9eb7c8;margin-bottom:3vh}.catbtn{width:72%;padding:1.7vh;margin:.7vh;border-radius:1.5vh;border:1px solid #f1cf6566;background:#ffffff0b;color:#fff;font-size:2vh;font-weight:900}
</style></head><body><div id="app"><div id="modegate" class="modegate"><h1>QUIZGAME MASTER</h1><div class="sub">CHOOSE GAME MODE</div><button class="modebtn live" onclick="startMode('live')">🔴 LIVE MODE</button><button class="modebtn dev" onclick="startMode('dev')">🛠 DEVELOPMENT MODE</button></div><div id="devpanel" class="devpanel"><h2>DEVELOPMENT MODE</h2><div class="hint">CHOOSE CATEGORY</div><div id="devcats"></div></div><div class="stage">
<div id="cat" class="screen on"><div class="ey">NEXT CATEGORY</div><div class="reel"><div id="items"></div><div class="focus"></div></div><div id="difficulty" class="difficulty"><div class="dl">DIFFICULTY LEVEL</div><div id="rail" class="rail"></div><div id="ready" class="ready">GET READY...</div></div></div>
<div id="question" class="screen"><div class="timer"><div id="bar" class="bar"></div></div><div id="qt" class="q"></div><div id="visual" class="visual"></div><div class="prompt">💬 TYPE <b>A, B, C or D</b> IN THE COMMENTS</div><div id="answers" class="answers"></div></div>
<div id="reveal" class="screen"><div class="correct">✓ CORRECT ANSWER</div><div id="country" class="country"></div><div id="factpic" class="factpic">✨</div><div class="fact"><b id="facttag">QUICK FACT</b><span id="fact"></span></div></div>
</div><div class="safe"><div>TikTok chat / interface safe zone</div></div><div class="version">QuizGameMaster · v0.2.0</div></div>
<script>
// Always fetch fresh game/data when opened from the fullscreen browser home page.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
const freshFetch=(url)=>fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
const $=x=>document.getElementById(x), flag=c=>"https://flagcdn.com/w320/"+c+".png";
const ranks=[["🌱","NEWBIE"],["🎯","ROOKIE"],["⚡","PRO"],["🥷","NINJA"],["👑","MASTER"]], rankIndex={newbie:0,rookie:1,pro:2,ninja:3,master:4};
let Q=[],ALLQ=[],i=0,state="menu",start,raf,last=-1,audio,mode=null;
function tone(f,d,v=.01){try{audio||=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function show(x){["cat","question","reveal"].forEach(y=>$(y).classList.toggle("on",x===y))}
function shuffleAnswers(q){let a=q.answers.map(x=>typeof x==="string"?{country:x}:x);for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}
function startMode(m){mode=m;$("modegate").classList.add("hide");if(m==="dev"){const cats=[...new Set(ALLQ.map(q=>q.category))];$("devcats").innerHTML=cats.map(x=>"<button class='catbtn' onclick=\"chooseDevCategory('"+x+"')\">"+x.toUpperCase()+"</button>").join("");$("devpanel").classList.add("show");}else{Q=[...ALLQ];shuffleQ();category()}}
function shuffleQ(){for(let n=Q.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[Q[n],Q[j]]=[Q[j],Q[n]]}}
function chooseDevCategory(cat){Q=ALLQ.filter(q=>q.category===cat);shuffleQ();i=0;$("devpanel").classList.remove("show");category()}
function category(){state="cat";show("cat");let q=Q[i],cats=[...new Set(ALLQ.map(x=>x.category.toUpperCase()))],seq=[];$("difficulty").classList.remove("show");$("ready").classList.remove("show");for(let r=0;r<7;r++)seq.push(...cats);let target=seq.length;seq.push((q.category||"FLAGS").toUpperCase(),...cats,...cats);$("items").innerHTML=seq.map(x=>"<div>"+x+"</div>").join("");$("items").style.transition="none";$("items").style.transform="translateY(0)";requestAnimationFrame(()=>requestAnimationFrame(()=>{$("items").style.transition="transform 3.7s cubic-bezier(.08,.70,.06,1)";$("items").style.transform="translateY("+(-(target-2)*5.4)+"vh)"}));setTimeout(()=>{$("items").children[target].classList.add("selected");tone(920,.14,.03)},3800);setTimeout(()=>difficulty(q),4400)}
function difficulty(q){let ix=rankIndex[q.difficulty];$("rail").innerHTML=ranks.map((r,n)=>"<div class='rank' id='r"+n+"'><span>"+r[0]+"</span>"+r[1]+"</div>").join("");$("difficulty").classList.add("show");let seq=[0,1,2,3,4,3,2,1,2,3,4,ix],n=0,iv=setInterval(()=>{document.querySelectorAll(".rank").forEach(e=>e.classList.remove("hot"));$("r"+seq[n]).classList.add("hot");tone(430+n*15,.025,.005);if(++n>=seq.length){clearInterval(iv);document.querySelectorAll(".rank").forEach((e,j)=>{e.classList.remove("hot");if(j!==ix)e.style.opacity=".28"});$("r"+ix).classList.add("final");tone(1000,.14,.03);setTimeout(()=>$("ready").classList.add("show"),500);setTimeout(question,2700)}},140)}
function question(){state="q";show("question");let q=Q[i],a=shuffleAnswers(q);q._shown=a;$("qt").textContent=q.question;let v=$("visual");v.classList.toggle("landscape",q.type==="landmark_image");if(q.type==="flag_to_country")v.innerHTML="<img src='"+flag(q.asset.code)+"'>";
else if(q.type==="landmark_image")v.innerHTML="<div class='mediafade'><img class='blur' src='"+q.asset.image+"'><img class='main' src='"+q.asset.image+"'></div>";
else v.innerHTML="<div class='subject'>"+q.subject.toUpperCase()+"</div>";$("answers").innerHTML=a.map((x,n)=>"<div class='ans'><div class='letter'>"+"ABCD"[n]+"</div>"+(q.type==="country_to_flag"?"<img src='"+flag(x.code)+"'>":"")+"<span>"+(q.type==="country_to_flag"?"":x.country)+"</span></div>").join("");start=performance.now();last=-1;raf=requestAnimationFrame(tick)}
function tick(now){let t=Math.min(1,(now-start)/30000),r=Math.pow(1-t,1.85);$("bar").style.width=r*100+"%";$("bar").style.background="hsl("+(120*(1-t))+" 86% 48%)";let s=Math.floor((now-start)/1000);if(s!==last){last=s;tone(500+300*t,.03,.003+.022*t*t)}if(t<1&&state==="q")raf=requestAnimationFrame(tick);else if(state==="q")reveal()}
function reveal(){if(state!=="q")return;state="mark";cancelAnimationFrame(raf);let q=Q[i],idx=q._shown.findIndex(x=>x.country===q.correct),cards=[...$("answers").children];cards.forEach((e,n)=>e.classList.add(n===idx?"good":"bad"));tone(660,.07,.025);setTimeout(()=>tone(920,.12,.03),100);setTimeout(()=>{state="r";show("reveal");$("country").textContent=q.correct.toUpperCase();$("facttag").textContent=q.fact_tag+" FACT";$("fact").textContent=q.fact;let fp=$("factpic");fp.innerHTML=q.asset&&q.asset.fact_image?"<div class='mediafade'><img class='blur' src='"+q.asset.fact_image+"'><img class='main' src='"+q.asset.fact_image+"'></div>":"✨"},1500);setTimeout(()=>{i=(i+1)%Q.length;category()},7000)}
document.body.onclick=()=>{audio||=new(window.AudioContext||window.webkitAudioContext)();if(state==="q")reveal()};
Promise.all(["../data/questions-flags.json","../data/questions-landmarks.json"].map(x=>freshFetch(x).then(r=>r.json()))).then(ds=>{ALLQ=ds.flatMap(d=>d.questions.map(q=>({...q,category:d.category})));Q=[...ALLQ]}).catch(e=>{document.body.innerHTML="<pre style='color:white;padding:20px'>Could not load question data. Run via a web server, not file://\n"+e+"</pre>"});
</script></body></html>
