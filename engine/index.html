<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizGameMaster</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><style>html,body{margin:0;height:100%;background:#02070d;color:#789;font-family:Arial,sans-serif;display:grid;place-items:center;font-size:12px}</style></head><body>Loading QuizGameMaster…<script>(async()=>{try{const r=await fetch('../version.json?_='+Date.now(),{cache:'no-store'});const raw=await r.text();const v=raw.trim().replace(/^.*?([0-9]+\.[0-9]+\.[0-9]+).*$/,'$1');location.replace('./game.html?v='+encodeURIComponent(v));}catch(e){location.replace('./game.html?fallback='+Date.now())}})();</script></body></html>
