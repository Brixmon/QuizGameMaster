<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>QuizGame Master · Controller</title>
<style>
:root{--bg:#050b11;--panel:#0c1923;--line:#244355;--text:#f3fbff;--muted:#8ba6b8;--gold:#ffd45e;--blue:#4bd1ff;--green:#55e59c;--red:#ff6d7b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#153d59 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}.wrap{min-height:100vh;padding:18px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;max-width:620px;margin:0 auto}.brand{text-align:center;font-weight:1000;letter-spacing:.12em;font-size:13px;color:#c3dce9}.brand b{color:var(--gold)}.room{text-align:center;color:#7d9bae;font-size:11px;font-weight:1000;letter-spacing:.1em;margin-top:7px}
.card{margin:auto 0;background:linear-gradient(180deg,#102331,#0a151e);border:1px solid var(--line);border-radius:20px;padding:18px}.card h1{font-size:28px;margin:0 0 7px;text-align:center}.card p{color:var(--muted);line-height:1.45;text-align:center;margin:0 0 18px}.field{margin-top:10px}.field label{display:block;color:#87a4b7;font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;min-height:52px;border:1px solid #2b4d62;background:#071722;color:white;border-radius:12px;padding:12px 13px;font-size:18px;outline:none}.field input:focus{border-color:var(--blue)}.primary{width:100%;min-height:54px;border:1px solid #4c94be;background:linear-gradient(180deg,#1c5b7a,#16465e);border-radius:13px;color:#fff;font-size:18px;font-weight:1000;margin-top:14px}.primary:disabled{opacity:.4}.status{min-height:20px;text-align:center;color:#83a1b4;font-size:12px;margin-top:10px}
.view{display:none;flex:1;flex-direction:column}.view.show{display:flex}.waiting{align-items:center;justify-content:center;text-align:center}.pulse{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:0 auto 17px;background:#102d42;border:1px solid #397a9f;font-size:34px;animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 28px #42c8ff33}}.waiting h2{font-size:27px;margin:0}.waiting p{color:var(--muted);line-height:1.5}.scorepill{display:inline-block;margin-top:10px;border:1px solid #4b6b7c;border-radius:999px;padding:7px 12px;color:var(--gold);font-weight:1000}
.playhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 12px}.qnum{color:#9bb6c7;font-size:12px;font-weight:1000;letter-spacing:.08em}.points{color:var(--gold);font-weight:1000}.questionmini{text-align:center;color:#eef8ff;font-size:20px;font-weight:850;line-height:1.28;margin:5px 8px 8px;min-height:50px}.questionvisual{display:none;width:100%;height:min(34vh,290px);margin:0 0 12px;border:1px solid #244355;border-radius:16px;overflow:hidden;background:#07131c;align-items:center;justify-content:center}.questionvisual.show{display:flex}.questionvisual img{width:100%;height:100%;object-fit:cover}.questionvisual img.flagmain{object-fit:contain;padding:5%;background:#e8eef2}.questionvisual .subject{font-size:34px;font-weight:1000;text-align:center;padding:20px}.instruction{text-align:center;color:#a9c3d2;font-size:13px;margin:3px 0 12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:400px}.ans{border:1px solid #2d6688;border-radius:20px;background:linear-gradient(180deg,#0d3554,#071d2d);color:#fff;font-size:54px;font-weight:1000;min-height:150px;touch-action:manipulation}.ans:active{transform:scale(.98)}.ans.selected{border-color:var(--gold);background:#4a3e13;color:#fff4b6}.ans:disabled{opacity:.72}.locked{text-align:center;color:#9eb8c8;font-size:13px;margin-top:12px;min-height:19px}
.result{align-items:center;justify-content:center;text-align:center}.resulticon{font-size:70px}.result h2{font-size:32px;margin:8px 0}.result.good h2{color:var(--green)}.result.bad h2{color:var(--red)}.delta{font-size:28px;font-weight:1000;color:var(--gold);margin:8px}.correctline{color:#b9d3e3;margin-top:8px}.leader{margin-top:18px;border-top:1px solid #1d3545;padding-top:14px;color:#9bb4c4}.final{justify-content:center}.final h1{text-align:center;font-size:34px}.finalscore{text-align:center;font-size:62px;color:var(--gold);font-weight:1000}.final p{text-align:center;color:var(--muted)}
@media(max-width:380px){.buttons{min-height:340px;gap:9px}.ans{min-height:130px;font-size:46px}.wrap{padding-left:10px;padding-right:10px}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="brand">QUIZGAME <b>MASTER</b></div>
 <div class="room" id="roomHeader">CONTROLLER</div>

 <section class="view show" id="joinView">
  <div class="card">
   <h1>Join the quiz</h1>
   <p>Your phone becomes the controller. No app needed.</p>
   <div class="field" id="roomField"><label>ROOM CODE</label><input id="roomInput" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="4821"></div>
   <div class="field"><label>YOUR NAME</label><input id="nameInput" maxlength="22" autocomplete="nickname" placeholder="Gatis"></div>
   <button class="primary" id="joinBtn">JOIN GAME</button>
   <div class="status" id="joinStatus"></div>
  </div>
 </section>

 <section class="view waiting" id="waitView">
  <div>
   <div class="pulse">🎮</div>
   <h2 id="waitTitle">You're in!</h2>
   <p id="waitText">Look at the TV. The quiz will start there.</p>
   <div class="scorepill"><span id="waitScore">0</span> ★</div>
  </div>
 </section>

 <section class="view" id="playView">
  <div class="playhead"><div class="qnum" id="qnum">QUESTION</div><div class="points"><span id="playScore">0</span> ★</div></div>
  <div class="questionmini" id="phoneQuestion">Question</div>
  <div class="questionvisual" id="phoneVisual"></div>
  <div class="instruction">Choose A / B / C / D</div>
  <div class="buttons">
   <button class="ans" data-letter="A">A</button>
   <button class="ans" data-letter="B">B</button>
   <button class="ans" data-letter="C">C</button>
   <button class="ans" data-letter="D">D</button>
  </div>
  <div class="locked" id="locked"></div>
 </section>

 <section class="view result" id="resultView">
  <div class="resulticon" id="resultIcon">✓</div>
  <h2 id="resultTitle">Correct!</h2>
  <div class="delta" id="resultDelta">+1 ★</div>
  <div class="correctline" id="correctLine"></div>
  <div class="leader">Total: <b><span id="resultScore">0</span> ★</b></div>
 </section>

 <section class="view final" id="finalView">
  <h1>Final score</h1>
  <div class="finalscore"><span id="finalScore">0</span> ★</div>
  <p>Look at the TV for the final ranking.</p>
 </section>
</div>
<script>
const BRIDGE="https://quizgamemaster-bridge.vip-krasts.workers.dev",ROOM_KEY="tvPrototype";
const $=id=>document.getElementById(id);
let roomCode=new URLSearchParams(location.search).get("room")||"",pid="",playerName="",room=null,lastQid="",pollTimer=0,writing=false,questions={},questionsReady=false;
function randomId(){try{if(window.crypto&&typeof window.crypto.randomUUID==="function")return window.crypto.randomUUID()}catch(e){}return "p-"+Date.now()+"-"+Math.random().toString(36).slice(2)}
function show(id){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("show",x.id===id))}
function cleanCode(v){return String(v||"").replace(/\D/g,"").slice(0,4)}
async function getState(){const r=await fetch(BRIDGE+"/game/state?_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("Cloud "+r.status);return r.json()}
async function putState(base,settings){const r=await fetch(BRIDGE+"/game/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({settings,players:(base?.players&&typeof base.players==="object")?base.players:{}})});if(!r.ok)throw Error("Save "+r.status)}
function storedPid(code){let key="qgm_tv_pid_"+code,v=localStorage.getItem(key);if(!v){v=randomId();localStorage.setItem(key,v)}return v}
function scoreOf(r){return Number(r&&r.scores?r.scores[pid]:0)||0}
function answerLabel(a){return typeof a==="string"?a:(a?(a.country||a.name||""):"")}
function flagUrl(code){return "https://flagcdn.com/w640/"+String(code||"").toLowerCase()+".png"}
function renderPhoneVisual(q){const v=$("phoneVisual");v.innerHTML="";v.classList.remove("show");if(!q)return;if(q.type==="flag_to_country"&&q.asset&&q.asset.code){const im=document.createElement("img");im.className="flagmain";im.src=flagUrl(q.asset.code);v.appendChild(im)}else if(q.asset&&q.asset.image){const im=document.createElement("img");im.src=q.asset.image;v.appendChild(im)}else{const d=document.createElement("div");d.className="subject";d.textContent=q.subject||q.correct||"";if(!d.textContent)return;v.appendChild(d)}v.classList.add("show")}
async function loadQuestions(){
 try{
  const [a,b]=await Promise.all([fetch("../data/questions-flags.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()),fetch("../data/questions-landmarks.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json())]);
  [...(a.questions||[]),...(b.questions||[])].forEach(q=>questions[q.qid]=q);questionsReady=true
 }catch(e){questionsReady=false}
}
function enableAnswers(){
 document.querySelectorAll(".ans").forEach(b=>{b.disabled=false;b.classList.remove("selected")})
}
async function mutateRoom(mutator,verify){
 if(writing)return false;writing=true;
 try{
  for(let attempt=0;attempt<4;attempt++){
   const base=await getState(),settings={...(base.settings||{})},latest=settings[ROOM_KEY];
   if(!latest||String(latest.code)!==String(roomCode))throw Error("Room not found");
   const next=JSON.parse(JSON.stringify(latest));mutator(next);next.updatedAt=Date.now();settings[ROOM_KEY]=next;await putState(base,settings);
   const check=await getState(),saved=check&&check.settings?check.settings[ROOM_KEY]:null;
   if(saved&&String(saved.code)===String(roomCode)&&(!verify||verify(saved))){room=saved;return true}
   await new Promise(r=>setTimeout(r,150+attempt*120))
  }
  throw Error("Try again")
 }finally{writing=false}
}
async function join(){
 roomCode=cleanCode($("roomInput").value||roomCode);playerName=$("nameInput").value.trim().slice(0,22);
 if(roomCode.length!==4){$("joinStatus").textContent="Enter the 4-digit room code.";return}
 if(!playerName){$("joinStatus").textContent="Enter your name.";return}
 $("joinBtn").disabled=true;$("joinStatus").textContent="Joining…";pid=storedPid(roomCode);
 try{
  const ok=await mutateRoom(r=>{r.players=r.players||{};r.players[pid]={name:playerName,joinedAt:(r.players[pid]&&r.players[pid].joinedAt)||Date.now(),lastSeen:Date.now()}},r=>!!r.players?.[pid]);
  if(!ok)throw Error("Could not join");
  localStorage.setItem("qgm_tv_name",playerName);$("roomHeader").textContent="ROOM "+roomCode+" · "+playerName.toUpperCase();show("waitView");render(room);schedulePoll()
 }catch(e){$("joinStatus").textContent=e.message==="Room not found"?"Room not found. Check the TV code.":"Could not join. Try again."}
 finally{$("joinBtn").disabled=false}
}
async function submit(letter){
 if(!room||room.phase!=="question"||writing)return;
 const qid=room.qid;
 document.querySelectorAll(".ans").forEach(b=>{b.disabled=true;b.classList.toggle("selected",b.dataset.letter===letter)});
 $("locked").textContent="Sending "+letter+"…";
 try{
  const ok=await mutateRoom(r=>{
   if(r.phase!=="question"||r.qid!==qid)throw Error("Question closed");
   r.answers=r.answers||{};r.answers[pid]={letter,qid,at:Date.now()};if(r.players&&r.players[pid])r.players[pid].lastSeen=Date.now()
  },r=>r.answers&&r.answers[pid]&&r.answers[pid].qid===qid&&r.answers[pid].letter===letter);
  if(ok){$("locked").textContent="";if(navigator.vibrate)navigator.vibrate(30)}
 }catch(e){
  $("locked").textContent=e.message==="Question closed"?"Question closed.":"Connection problem — tap again.";
  enableAnswers()
 }
}
function render(r){
 if(!r)return;room=r;
 $("waitScore").textContent=scoreOf(r);$("playScore").textContent=scoreOf(r);$("resultScore").textContent=scoreOf(r);$("finalScore").textContent=scoreOf(r);
 if(r.phase==="lobby"){show("waitView");$("waitTitle").textContent="You're in!";$("waitText").textContent="Look at the TV. The host will start the quiz."}
 if(r.phase==="question"){
  show("playView");$("qnum").textContent="QUESTION "+(Number(r.index)+1)+" / "+((r.sequence&&r.sequence.length)||"?");
  const mine=r.answers&&r.answers[pid],answered=!!(mine&&mine.qid===r.qid),isNew=lastQid!==r.qid;
  const q=questions[r.qid];$("phoneQuestion").textContent=q&&q.question?q.question:"Question";renderPhoneVisual(q);
  if(isNew){lastQid=r.qid;$("locked").textContent="";enableAnswers()}
  if(answered){$("locked").textContent="";document.querySelectorAll(".ans").forEach(b=>{b.disabled=true;b.classList.toggle("selected",b.dataset.letter===mine.letter)})}
  else if(!writing){document.querySelectorAll(".ans").forEach(b=>b.disabled=false)}
 }
 if(r.phase==="reveal"){
  const res=r.lastResults?r.lastResults[pid]:null,good=!!(res&&res.correct);show("resultView");$("resultView").classList.toggle("good",good);$("resultView").classList.toggle("bad",!good);
  $("resultIcon").textContent=good?"✓":"✕";$("resultTitle").textContent=good?"Correct!":(res&&res.answer?"Not this time":"No answer");
  const d=Number(res&&res.delta)||0;$("resultDelta").textContent=(d>0?"+":"")+d+" ★";$("correctLine").textContent="Correct answer: "+(r.correctLetter||"")+" · "+(r.correctLabel||"")
 }
 if(r.phase==="final")show("finalView")
}
async function poll(){
 try{
  const j=await getState(),r=j&&j.settings?j.settings[ROOM_KEY]:null;
  if(!r||String(r.code)!==String(roomCode)){show("joinView");$("joinStatus").textContent="This room has ended.";return}
  if(!(r.players&&r.players[pid])&&playerName){await mutateRoom(x=>{x.players=x.players||{};x.players[pid]={name:playerName,joinedAt:Date.now(),lastSeen:Date.now()}},x=>!!x.players?.[pid])}
  render(r)
 }catch(e){}
 schedulePoll()
}
function schedulePoll(){clearTimeout(pollTimer);pollTimer=setTimeout(poll,650)}
document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>submit(b.dataset.letter));
$("joinBtn").onclick=join;$("roomInput").addEventListener("input",e=>e.target.value=cleanCode(e.target.value));$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")join()});
if(roomCode){roomCode=cleanCode(roomCode);$("roomInput").value=roomCode;$("roomField").style.display="none";$("roomHeader").textContent="ROOM "+roomCode}
$("nameInput").value=localStorage.getItem("qgm_tv_name")||"";
loadQuestions();
</script>
</body>
</html>
