name: Import country flags
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-flags.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download SVG country flags
        run: |
          set -e
          rm -rf /tmp/country-flags /tmp/flags.tar.gz
          curl -L https://github.com/hampusborgos/country-flags/archive/refs/heads/main.tar.gz -o /tmp/flags.tar.gz
          mkdir -p /tmp/country-flags
          tar -xzf /tmp/flags.tar.gz -C /tmp/country-flags --strip-components=1
          mkdir -p assets/flags
          cp /tmp/country-flags/svg/*.svg assets/flags/
          cp /tmp/country-flags/countries.json assets/flags/countries.json
          cp /tmp/country-flags/README.md assets/flags/SOURCE.md
      - name: Commit imported flags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flags
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import complete SVG country flag library"
          git push
